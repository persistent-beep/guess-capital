<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4facfe">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Угадай столицу">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <title>Угадай столицу</title>
</head>
<body>

<div id="app">

  <!-- ============================================================
       ЭКРАН 1 — Welcome / Login
       ============================================================ -->
  <div id="welcome-screen" class="screen">
    <div class="logo-wrap">
      <img src="assets/logo.svg" alt="Логотип">
      <div class="logo-title">Угадай столицу</div>
      <div class="logo-subtitle">Образовательная игра по географии</div>
    </div>
    <div class="welcome-actions">
      <button class="btn btn-primary" id="btn-create-player">➕ Создать игрока</button>
    </div>
    <div class="player-list">
      <div class="player-list-title" id="player-list-title"></div>
      <div id="player-list"></div>
    </div>
  </div>

  <!-- Модалка создания игрока -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-title">Новый игрок</div>
      <input type="text" class="input-field" id="player-name-input" placeholder="Введите имя" maxlength="20">
      <div class="avatar-picker" id="avatar-picker"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-cancel">Отмена</button>
        <button class="btn btn-primary" id="modal-confirm">Создать</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
       ЭКРАН 2 — Game
       ============================================================ -->
  <div id="game-screen" class="screen">
    <div class="top-bar">
      <div class="top-bar-left">
        <div class="player-badge">
          <span class="avatar" id="player-badge-avatar">🦊</span>
          <span id="player-badge-name">Игрок</span>
        </div>
        <span class="stat-badge" id="stat-correct">✅ 0</span>
        <span class="stat-badge" id="stat-wrong">❌ 0</span>
        <span class="streak-badge" id="streak-badge" style="display:none;">🔥 0</span>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-icon" id="btn-settings" title="Настройки">⚙️</button>
        <button class="btn-icon" id="btn-leaderboard" title="Рейтинг">🏆</button>
        <button class="btn-icon" id="btn-home" title="Выход">🏠</button>
      </div>
    </div>
    <div class="game-image-wrap" id="game-image-wrap">
      <div class="game-image-placeholder">🌍</div>
    </div>
    <div class="task-label" id="task-label">Загрузка...</div>
    <div class="answer-form">
      <div class="answer-input-row">
        <input type="text" class="answer-input" id="answer-input" placeholder="Ваш ответ..." autocomplete="off" autocorrect="off" autocapitalize="off">
        <button class="btn btn-primary answer-btn" id="answer-btn">Ответить</button>
      </div>
      <div class="game-feedback" id="game-feedback"></div>
      <div class="game-actions">
        <button class="btn btn-ghost" id="btn-skip">Пропустить</button>
        <button class="btn btn-success" id="btn-next" style="display:none;">Следующий →</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
       ЭКРАН 3 — Settings
       ============================================================ -->
  <div id="settings-screen" class="screen">
    <div class="top-bar">
      <button class="btn btn-ghost" id="btn-settings-back">← Назад</button>
      <div style="font-weight:700;font-size:18px;">Настройки</div>
      <div style="width:60px;"></div>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">🖼️ Что показывать</div>
      <div class="settings-options" id="hint-options"></div>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">🎯 Что угадывать</div>
      <div class="settings-options" id="task-options"></div>
    </div>
  </div>

  <!-- ============================================================
       ЭКРАН 4 — Leaderboard
       ============================================================ -->
  <div id="leaderboard-screen" class="screen">
    <div class="top-bar">
      <button class="btn btn-ghost" id="btn-leaderboard-back">← Назад</button>
      <div style="font-weight:700;font-size:18px;">🏆 Рейтинг</div>
      <div style="width:60px;"></div>
    </div>
    <div class="leaderboard-list" id="leaderboard-list"></div>
  </div>

</div>

<!-- Canvas для конфетти -->
<canvas id="confetti-canvas"></canvas>

<!-- ============================================================
     Скрипты — порядок важен
     ============================================================ -->
<script src="data/countries.js"></script>
<script src="js/db.js"></script>
<script src="js/answer-checker.js"></script>
<script src="js/auth.js"></script>
<script src="js/game.js"></script>
<script src="js/settings.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/app.js"></script>

</body>
</html>
