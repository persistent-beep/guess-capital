<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <title>Флаг Республики Казахстан</title>

  <!-- Голубое полотнище -->
  <rect width="1200" height="600" fill="#00AFCA"/>

  <defs>
    <!-- Один луч солнца -->
    <path id="ray" d="M -5,-63 L 0,-100 L 5,-63 Z"/>

    <!-- Элемент орнамента «кошкар-муиз» -->
    <g id="ornUnit" fill="none" stroke="#FEC50C" stroke-width="7" stroke-linecap="round">
      <path d="M 0,-32 L 0,32"/>
      <path d="M 1,-2 C 14,-4 21,-13 16,-22 C 12,-29 4,-27 5,-20 C 5.5,-16 10,-15 12,-18"/>
      <path d="M -1,-2 C -14,-4 -21,-13 -16,-22 C -12,-29 -4,-27 -5,-20 C -5.5,-16 -10,-15 -12,-18"/>
      <path d="M 1,2 C 14,4 21,13 16,22 C 12,29 4,27 5,20 C 5.5,16 10,15 12,18"/>
      <path d="M -1,2 C -14,4 -21,13 -16,22 C -12,29 -4,27 -5,20 C -5.5,16 -10,15 -12,18"/>
    </g>
  </defs>

  <!-- Солнце с 32 лучами -->
  <g transform="translate(600,205)" fill="#FEC50C">
