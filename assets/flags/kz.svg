<<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">svg xmlns="http://w3.org" viewBox="0 0 1000 500" width="100%" height="100%">
  <!-- Фон: небесно-голубой цвет флага -->
  <rect width="1000" height="500" fill="#00afca"/>
  
  <!-- Единый стиль для всех золотых элементов флага -->
  <g fill="#fec100">
    <!-- НАЦИОНАЛЬНЫЙ ОРНАМЕНТ (У левого края полотнища) -->
    <g transform="translate(15, 0) scale(0.95)">
      <!-- Повторяющийся вертикальный узор контуров орнамента -->
      <path d="M 35,0 L 35,500 M 35,25 C 10,25 5,50 25,65 C 50,75 55,45 35,45 C 20,45 20,35 35,35 Z"/>
      <path d="M 35,100 C 10,100 5,125 25,140 C 50,150 55,120 35,120 C 20,120 20,110 35,110 Z"/>
      <path d="M 35,175 C 10,175 5,200 25,215 C 50,225 55,195 35,195 C 20,195 20,185 35,185 Z"/>
      <path d="M 35,250 C 10,250 5,275 25,290 C 50,300 55,270 35,270 C 20,270 20,260 35,260 Z"/>
      <path d="M 35,325 C 10,325 5,350 25,365 C 50,375 55,345 35,345 C 20,345 20,335 35,335 Z"/>
      <path d="M 35,400 C 10,400 5,425 25,440 C 50,450 55,420 35,420 C 20,420 20,410 35,410 Z"/>
      <path d="M 35,475 C 10,475 5,500 25,515 C 50,525 55,495 35,495 C 20,495 20,485 35,485 Z"/>
      <!-- Зеркальная правая часть волны орнамента -->
      <path d="M 35,25 C 60,25 65,50 45,65 C 20,75 15,45 35,45 C 50,45 50,35 35,35 Z"/>
      <path d="M 35,100 C 60,100 65,125 45,140 C 20,150 15,120 35,120 C 50,120 50,110 35,110 Z"/>
      <path d="M 35,175 C 60,175 65,200 45,215 C 20,225 15,195 35,195 C 50,195 50,185 35,185 Z"/>
      <path d="M 35,250 C 60,250 65,275 45,290 C 20,300 15,270 35,270 C 50,270 50,260 35,260 Z"/>
      <path d="M 35,325 C 60,325 65,350 45,365 C 20,375 15,345 35,345 C 50,345 50,335 35,335 Z"/>
      <path d="M 35,400 C 60,400 65,425 45,440 C 20,450 15,420 35,420 C 50,420 50,410 35,410 Z"/>
    </g>

    <!-- ЦЕНТРАЛЬНЫЙ ЭЛЕМЕНТ: СОЛНЦЕ С ЛУЧАМИ -->
    <g transform="translate(500, 190)">
      <!-- Основа солнца: central circle -->
      <circle cx="0" cy="0" r="54"/>
      <!-- Пример нескольких основных лучей солнца (построены по кругу) -->
      <path d="M 0,-54 L 7,-75 L -7,-75 Z M 0,54 L 7,75 L -7,75 Z M -54,0 L -75,7 L -75,-7 Z M 54,0 L 75,7 L 75,-7 Z"/>
      <path d="M -38,-38 L -53,-53 L -43,-53 Z M 38,38 L 53,53 L 43,53 Z M -38,38 L -53,53 L -53,43 Z M 38,-38 L 53,-53 L 53,-43 Z"/>
      <!-- Волнообразные декоративные лучи в форме зерен вокруг диска -->
      <path d="M0,0 M-70,20 C-90,10 -80,-10 -65,-5 C-55,0 -60,15 -70,20 Z" transform="rotate(15)"/>
      <path d="M0,0 M-70,20 C-90,10 -80,-10 -65,-5 C-55,0 -60,15 -70,20 Z" transform="rotate(45)"/>
      <path d="M0,0 M-70,20 C-90,10 -80,-10 -65,-5 C-55,0 -60,15 -70,20 Z" transform="rotate(75)"/>
      <path d="M0,0 M-70,20 C-90,10 -80,-10 -65,-5 C-55,0 -60,15 -70,20 Z" transform="rotate(105)"/>
      <path d="M0,0 M-70,20 C-90,10 -80,-10 -65,-5 C-55,0 -60,15 -70,20 Z" transform="rotate(135)"/>
      <path d="M0,0 M-70,20 C-90,10 -80,-10 -65,-5 C-55,0 -60,15 -70,20 Z" transform="rotate(165)"/>
      <path d="M0,0 M-70,20 C-90,10 -80,-10 -65,-5 C-55,0 -60,15 -70,20 Z" transform="rotate(195)"/>
      <path d="M0,0 M-70,20 C-90,10 -80,-10 -65,-5 C-55,0 -60,15 -70,20 Z" transform="rotate(225)"/>
      <path d="M0,0 M-70,20 C-90,10 -80,-10 -65,-5 C-55,0 -60,15 -70,20 Z" transform="rotate(255)"/>
      <path d="M0,0 M-70,20 C-90,10 -80,-10 -65,-5 C-55,0 -60,15 -70,20 Z" transform="rotate(285)"/>
      <path d="M0,0 M-70,20 C-90,10 -80,-10 -65,-5 C-55,0 -60,15 -70,20 Z" transform="rotate(315)"/>
      <path d="M0,0 M-70,20 C-90,10 -80,-10 -65,-5 C-55,0 -60,15 -70,20 Z" transform="rotate(345)"/>
    </g>

    <!-- ПАРЯЩИЙ СТЕПНОЙ ОРЕЛ (Под солнцем) -->
    <path d="M 330,310 C 360,290 410,275 450,285 C 480,292 500,310 500,310 C 500,310 520,292 550,285 C 590,275 640,290 670,310 C 630,335 580,330 550,325 C 525,320 505,335 500,345 C 495,335 475,320 450,325 C 420,330 370,335 330,310 Z M 460,324 C 480,315 490,325 500,335 C 510,325 520,315 540,324 C 520,335 480,335 460,324 Z"/>
  </g>
</svg>
