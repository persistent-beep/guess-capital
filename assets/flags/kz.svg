  <!-- Парящий орёл -->
  <g transform="translate(600,410)" fill="#FEC50C">
    <path d="M -245,-78
             C -195,-60 -148,-48 -100,-44
             C -74,-42 -52,-44 -38,-52
             C -41,-58 -45,-64 -50,-69
             C -43,-71 -37,-76 -33,-83
             C -26,-91 -15,-92 -11,-84
             C -7,-76 -5,-66 -3,-56
             C 28,-46 62,-42 100,-44
             C 148,-48 195,-60 245,-78
             C 236,-58 218,-44 196,-37
             L 202,-16
             C 184,-28 168,-31 152,-28
             L 156,-6
             C 138,-18 122,-21 108,-18
